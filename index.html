function validate(b){if(!b||!Array.isArray(b.students)||!Array.isArray(b.exams)||!b.scores||typeof b.scores!=='object'||Array.isArray(b.scores))throw Error('备份数据格式不正确');if(b.students.length>500||b.exams.length>100)throw Error('最多支持500位学生和100场考试');for(const list of [b.students,b.exams]){const ids=new Set();for(const x of list){if(!x||typeof x.id!=='string'||!x.id.trim()||x.id.length>80||['__proto__','constructor','prototype'].includes(x.id)||typeof x.name!=='string'||!x.name.trim()||x.name.length>80||ids.has(x.id))throw Error('学号或考试编号重复、为空或无效');ids.add(x.id)}}for(const e of b.exams){if(!['平时','期中','期末'].includes(e.kind)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!Number.isFinite(Date.parse(e.date)))throw Error('考试类型或日期无效');for(const s of subj(e))if(!Number.isFinite(e.max?.[s])||e.max[s]<=0||e.max[s]>1000)throw Error('满分应为1至1000之间的数值')}for(const [eid,rows] of Object.entries(b.scores)){const e=b.exams.find(x=>x.id===eid);if(!e||!rows||typeof rows!=='object')throw Error('成绩对应的考试不存在');for(const [sid,scores] of Object.entries(rows)){if(!b.students.some(x=>x.id===sid)||!scores||typeof scores!=='object')throw Error('成绩对应的学生不存在');for(const [s,v] of Object.entries(scores))if(!subj(e).includes(s)||v!==null&&(!Number.isFinite(v)||v<0||v>e.max[s]))throw Error('存在超出满分范围或科目不匹配的成绩')}}}
function persist(next){validate(next);if(!demo){if(!storageOK)throw Error('当前浏览器禁止本地存储；请更换浏览器或允许本地文件存储');localStorage.setItem(KEY,JSON.stringify(next))}book=next;notice=demo?'演示数据只在当前页面有效，没有保存':'已保存在当前浏览器 · '+new Date().toLocaleTimeString('zh-CN');modal='';render()}
function init(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);validate(parsed);book=parsed}}catch(e){storageOK=false;notice='无法读取浏览器存储：'+e.message+'。请先下载已有备份，或换浏览器打开。'}examId=sorted().at(-1)?.id||'';studentId=book.students[0]?.id||'';render()}
function sorted(){return [...book.exams].sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name))}function exam(){return book.exams.find(e=>e.id===examId)||sorted().at(-1)}function student(){return book.students.find(s=>s.id===studentId)||book.students[0]}function score(e,id,s){return book.scores[e.id]?.[id]?.[s]??null}function total(e,id,ss=CORE){if(!e)return null;const values=ss.map(s=>score(e,id,s));return values.every(v=>typeof v==='number')?values.reduce((a,b)=>a+b,0):null}function rate(e,id){const t=total(e,id);return t==null?null:t/CORE.reduce((a,s)=>a+e.max[s],0)*100}function nvals(e,s){return book.students.map(st=>score(e,st.id,s)).filter(v=>typeof v==='number')}
function button(label,action,cls=''){return `<button type="button" data-action="${action}" class="${cls}">${label}</button>`}function badge(t){return `<span class="badge">${t}</span>`}function card(content,cls=''){return `<section class="card ${cls}">${content}</section>`}function head(title,side=''){return `<div class="sectionhead"><h3>${title}</h3>${side}</div>`}function metric(label,val,detail){return `<article class="metric"><span>${label}</span><strong>${val}</strong><small>${detail}</small></article>`}
function lineChart(points){if(!points.some(p=>p.value!==null))return '<div class="chartempty">录入成绩后，这里将出现成长曲线</div>';const x=i=>45+i*575/Math.max(points.length-1,1),y=v=>190-v*1.55;let lines='';for(let i=1;i<points.length;i++)if(points[i].value!==null&&points[i-1].value!==null)lines+=`<line x1="${x(i-1)}" y1="${y(points[i-1].value)}" x2="${x(i)}" y2="${y(points[i].value)}" stroke="#278674" stroke-width="3"/>`;return `<div class="chart"><svg viewBox="0 0 660 230" role="img" aria-label="三科得分率折线图">${[0,25,50,75,100].map(v=>`<line x1="37" y1="${y(v)}" x2="635" y2="${y(v)}" stroke="#e4ece7" stroke-dasharray="4 5"/><text x="3" y="${y(v)+4}" font-size="10" fill="#82978c">${v}%</text>`).join('')}${lines}${points.map((p,i)=>`<g><title>${esc(p.label)}：${p.value==null?'无完整三科成绩':fmt(p.value)+'%'}</title>${p.value!==null?`<circle cx="${x(i)}" cy="${y(p.value)}" r="5" fill="white" stroke="#278674" stroke-width="3"/><text x="${x(i)}" y="${y(p.value)-11}" text-anchor="middle" font-size="10" fill="#278674">${fmt(p.value)}%</text>`:''}<text x="${x(i)}" y="215" text-anchor="${i===0?'start':i===points.length-1?'end':'middle'}" font-size="10" fill="#81938a">${esc(p.label.slice(0,9))}</text></g>`).join('')}</svg></div>`}
function overview(e){const complete=e?book.students.map(s=>total(e,s.id)).filter(v=>v!==null):[],rates=e?book.students.map(s=>rate(e,s.id)).filter(v=>v!==null):[];return `<div class="hero"><div>${badge('一起进步 · 向光而行')}<h2>成绩是起点，成长是方向。</h2><p>平时聚焦语文、数学、英语；期末再看七科全貌。</p>${button(e?'录入本次成绩 ↗':'创建第一场考试 ↗',e?'open-import':'open-exam')}</div><div class="hero-art">✦<small>一步一步，成为更好的自己</small></div></div><div class="metrics">${metric('学生档案',book.students.length,'位同学')}${metric('三科平均分',fmt(avg(complete)),e?'满分 '+CORE.reduce((a,s)=>a+e.max[s],0):'等待考试')}${metric('三科平均得分率',rates.length?fmt(avg(rates))+'%':'—','完整三科成绩 '+rates.length+' 人')}${metric('已记录考试',book.exams.length,'次成长记录')}</div><div class="two">${card(head('三科平均得分率趋势',badge('按考试日期'))+lineChart(sorted().map(ex=>({label:ex.name,value:avg(book.students.map(s=>rate(ex,s.id)).filter(v=>v!==null))})))+'<p class="muted">只统计三科齐全的学生。不同试卷的难度和参考人数可能不同，变化仅供回顾。</p>')}${card(head('本次学科表现')+CORE.map((s,i)=>{const v=e?nvals(e,s):[],a=avg(v);return `<div class="subjectbar"><div><b>${s}</b><span>${fmt(a)} <small>/ ${e?e.max[s]:'—'}</small></span></div><div class="track"><i style="width:${a==null?0:a/e.max[s]*100}%;background:${['#268879','#e3ac52','#7d91cb'][i]}"></i></div><small>${v.length} 份有效成绩</small></div>`}).join('')+button('查看完整学科分析 →','view-subjects','textbutton'))}</div>${!e?card('<div class="empty"><div class="emptyicon">✧</div><h3>从第一份成绩开始</h3><p>先新建考试，设置各科满分，再导入学生和成绩。</p>'+button('先体验虚构示例','demo')+'</div>'):''}`}
function scores(e){if(!e)return emptyState();const ss=subj(e),rank=book.students.map(s=>total(e,s.id)).filter(v=>v!==null);return card(head(esc(e.name),`<div class="actions">${button('CSV 导入','open-import')}${button('编辑成绩','open-scores','primary')}</div>`)+`<p class="muted">空白或缺考显示“—”，0 分正常计入。名次仅按本次完整三科成绩计算。</p><input id="search" type="search" aria-label="查找学生" placeholder="搜索姓名或学号…" value="${esc(search)}"><div class="tablewrap"><table><thead><tr><th>学号</th><th>姓名</th>${ss.map(s=>`<th>${s}<small> / ${e.max[s]}</small></th>`).join('')}<th>三科总分</th>${e.kind==='期末'?'<th>七科总分</th>':''}<th>三科班内名次</th></tr></thead><tbody>${book.students.filter(s=>(s.name+s.id).includes(search)).map(s=>{const t=total(e,s.id);return `<tr><td>${esc(s.id)}</td><td>${button(esc(s.name),'student:'+encodeURIComponent(s.id),'linkbutton')}</td>${ss.map(sub=>`<td>${score(e,s.id,sub)??'—'}</td>`).join('')}<td><b>${fmt(t)}</b></td>${e.kind==='期末'?`<td>${fmt(total(e,s.id,ALL))}</td>`:''}<td>${t==null?'—':1+rank.filter(v=>v>t).length}</td></tr>`}).join('')}</tbody></table></div>`)}
function subjectsView(e){if(!e)return emptyState();return `<div class="notice">及格按满分的 60%、优秀按 85% 作为分析参考，不代表学校正式评定标准。每科只统计有效成绩。</div><div class="subjectgrid">${subj(e).map(s=>{const vals=nvals(e,s),a=avg(vals);return card(head(s,badge('满分 '+e.max[s]))+`<div class="big">${fmt(a)}<small> 平均分</small></div><div class="mini"><span>及格率 <b>${vals.length?fmt(vals.filter(v=>v/e.max[s]>=.6).length/vals.length*100)+'%':'—'}</b></span><span>优秀率 <b>${vals.length?fmt(vals.filter(v=>v/e.max[s]>=.85).length/vals.length*100)+'%':'—'}</b></span></div><h4>得分率分布</h4>${[[0,60,'60% 以下'],[60,85,'60%–85%'],[85,101,'85% 及以上']].map(([lo,hi,label])=>{const count=vals.filter(v=>v/e.max[s]*100>=lo&&v/e.max[s]*100<hi).length;return `<div class="dist"><span>${label}</span><div class="track"><i style="width:${vals.length?count/vals.length*100:0}%"></i></div><b>${count} 人</b></div>`}).join('')}<p class="muted">有效 ${vals.length} 人 · 未录入/缺考 ${book.students.length-vals.length} 人</p>`)}).join('')}</div>`}
function studentsView(e){const st=student();if(!st)return emptyState('暂无学生档案','先添加学生或导入成绩。');return `<div class="sectionhead"><select id="student-select" aria-label="选择学生">${book.students.map(s=>`<option value="${esc(s.id)}" ${st.id===s.id?'selected':''}>${esc(s.id)} · ${esc(s.name)}</option>`).join('')}</select>${button('打印成长报告','print')}</div>${card(`<div class="profile"><div class="avatar">${esc(st.name.slice(0,1))}</div><div><h2>${esc(st.name)}的成长档案</h2><p>学号 ${esc(st.id)} · 2604 班 · 每一步都值得被看见</p></div></div>${lineChart(sorted().map(ex=>({label:ex.name,value:rate(ex,st.id)})))}<p class="muted">三科总得分率趋势；缺少任一科时不连线。分数变化不直接代表能力变化。</p>`)}<div class="two">${card(head('本次学习提示')+(e?CORE.map(s=>{const v=score(e,st.id,s),r=v==null?null:v/e.max[s];return `<div class="advice"><b>${s} · ${v??'未录入'}</b><p>${r==null?'补齐成绩后再一起回顾这次学习。':r>=.85?'继续保持，试着把一道有价值的错题讲给自己听，检查思路是否完整。':r>=.6?'找出两道会做却失分的题，重新完成，并写下下次要提醒自己的一件事。':'从一处基础知识入手，先看例题，再独立做两道同类题，有困难及时请教老师。'}</p></div>`}).join(''):'<p>选择一场考试后查看建议。</p>')+'<small>提示仅根据得分率生成，具体问题需要结合试卷判断。</small>')}${card(head('历次成绩记录')+`<div class="tablewrap"><table><thead><tr><th>考试</th>${CORE.map(s=>`<th>${s}</th>`).join('')}<th>三科得分率</th></tr></thead><tbody>${sorted().map(ex=>`<tr><td>${esc(ex.name)}</td>${CORE.map(s=>`<td>${score(ex,st.id,s)??'—'}</td>`).join('')}<td>${rate(ex,st.id)==null?'—':fmt(rate(ex,st.id))+'%'}</td></tr>`).join('')}</tbody></table></div>`)}</div>`}
function settings(){return `<div class="two">${card(head('学生档案')+'<p>学号用于关联历次成绩。同名学生请使用不同学号。</p>'+button('添加学生','open-student','primary')+'<p class="muted">也可在成绩 CSV 中批量添加。</p><hr>'+head('备份与恢复')+'<p>成绩保存在这个浏览器中。换设备或换网站地址时，先导出备份，再在新页面恢复。</p>'+button('下载完整 JSON 备份','backup')+'<label class="upload">选择 JSON 备份恢复<input id="restore-file" type="file" accept=".json,application/json"></label><p class="muted">恢复会替换当前浏览器的全部成绩，请先下载现有备份。</p>')}${card(head('考试与统计规则')+'<p>平时/期中：语文、数学、英语。</p><p>期末：增加道德与法治、历史、地理、生物。</p><p>各科满分可设置；默认 100 分仅供起步，请按实际试卷修改。</p><p>趋势始终使用三科得分率，期末七科总分单独呈现。缺考不当作零分。</p><div class="notice">当前文件只在本机浏览器存储成绩。发布到 GitHub Pages 后，数据仍只保存在每位使用者自己的浏览器中，不会在设备间自动同步。</div>'+button('体验虚构示例','demo'))}</div>`}
function emptyState(title='还没有考试',msg='新建考试后即可开始录入与分析。'){return card(`<div class="empty"><div class="emptyicon">✧</div><h3>${title}</h3><p>${msg}</p>${button('新建考试','open-exam','primary')} ${button('体验虚构示例','demo')}</div>`)}
function render(){const e=exam(),names={overview:'学习概览',scores:'成绩总表',subjects:'学科分析',students:'成长档案',settings:'数据管理'};$('#app').innerHTML=`<div class="shell"><aside><div class="brand"><img src="data:image/png;base64,${EMBLEM}" alt="2604班金日版班徽"><span>明 · 成长<small>2604 班学情管理</small></span></div><div class="side-label">学习与成长</div><nav>${[['overview','◫'],['scores','▦'],['subjects','◩'],['students','♙'],['settings','⚙']].map(([k,icon])=>button(`<span class="navicon">${icon}</span>${names[k]}`,'view-'+k,view===k?'active':'')).join('')}</nav><div class="side-bottom">✦<strong>明德笃志，博学笃行。</strong><p>每一次记录，<br>都是下一步成长的起点。</p>${badge('初一 · 教师管理空间')}</div></aside><main><header><span>2604 班 <em>/</em> ${names[view]}</span><span class="sync">◯ ${demo?'演示模式 · 不写入存储':storageOK?'仅保存在当前浏览器':'本地存储不可用'}</span></header><div class="content"><div class="heading"><div><div class="eyebrow">LEARNING, ONE STEP AT A TIME</div><h1>${names[view]}</h1><p>看见努力的轨迹，让每一份进步都有方向。</p></div><div class="actions"><select id="exam-select" aria-label="选择考试"><option value="" disabled ${!e?'selected':''}>选择考试</option>${sorted().map(ex=>`<option value="${esc(ex.id)}" ${ex.id===e?.id?'selected':''}>${esc(ex.name)}</option>`).join('')}</select>${button('＋ 新建考试','open-exam','primary')}</div></div>${notice?`<div class="${storageOK?'notice':'error'}" role="status">${esc(notice)}</div>`:''}${demo?`<div class="notice">当前是虚构示例，刷新即消失，不会覆盖真实成绩。${button('返回真实数据','leave-demo')}</div>`:''}${view==='overview'?overview(e):view==='scores'?scores(e):view==='subjects'?subjectsView(e):view==='students'?studentsView(e):settings()}<footer>2604，胸怀壮志，青春正炽，无可复制。<span>明 · 成长 / 记录每一步</span></footer></div></main></div>${modal?modalView(e):''}`;}
function modalView(e){const title={exam:'新建考试',student:'添加学生',scores:'编辑本次成绩',import:'批量导入成绩',restore:'恢复备份'}[modal];return `<div class="overlay" id="overlay"><section role="dialog" aria-modal="true" aria-label="${title}" class="dialog ${modal==='scores'?'wide':''}"><div class="sectionhead"><h2>${title}</h2>${button('✕','close')}</div><div id="modal-error" role="alert"></div>${modal==='exam'?`<form id="exam-form"><label>考试名称<input name="name" required maxlength="80" placeholder="例如：七年级上学期期中检测" value="${esc(draft.name)}"></label><div class="form-two"><label>考试日期<input name="date" required type="date" value="${esc(draft.date)}"></label><label>考试类型<select name="kind" id="kind">${['平时','期中','期末'].map(k=>`<option ${draft.kind===k?'selected':''}>${k}</option>`).join('')}</select></label></div><h4>各科满分（请按实际试卷修改）</h4><div class="maxgrid" id="maxgrid">${maxFields()}</div><button class="primary">创建并保存</button></form>`:modal==='student'?`<form id="student-form"><label>学号<input name="id" required maxlength="80"></label><label>姓名<input name="name" required maxlength="80"></label><button class="primary">保存学生</button></form>`:modal==='scores'?`<p>空白表示缺考或未录入；0 分表示实际得 0 分。可输入小数。</p><div class="tablewrap edit"><table><thead><tr><th>学生</th>${subj(e).map(s=>`<th>${s}<small> / ${e.max[s]}</small></th>`).join('')}</tr></thead><tbody>${book.students.map(st=>`<tr><td>${esc(st.name)}<small>${esc(st.id)}</small></td>${subj(e).map(s=>`<td><input type="number" step="any" min="0" max="${e.max[s]}" data-sid="${esc(st.id)}" data-sub="${s}" aria-label="${esc(st.name+s)}" value="${draft[st.id]?.[s]??''}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><button data-action="save-scores" class="primary" ${!book.students.length?'disabled':''}>保存全部成绩</button>${!book.students.length?'<p>请先在数据管理中添加学生，或使用 CSV 导入。</p>':''}`:modal==='import'?`<p>下载当前考试模板，用 Excel 填写后另存为 CSV UTF-8。学号相同会更新本次成绩，其余考试不受影响。</p>${button('↓ 下载 CSV 模板','template')}<label class="upload">选择 CSV 文件<input type="file" id="csv-file" accept=".csv,text/csv"></label><label>或粘贴 CSV 内容<textarea id="csv-text" rows="9" placeholder="学号,姓名,${subj(e).join(',')}"></textarea></label><p class="muted">空白或“缺考”不计分。导入前检查学号、姓名、科目与分数；有错误时整批拒绝。</p>${button('校验并保存','import-csv','primary')}`:`<p>将以备份中的 ${draft.students.length} 名学生、${draft.exams.length} 场考试替换当前所有记录。建议先下载当前备份。</p>${button('确认恢复并保存','confirm-restore','primary')}`}</section></div>`}
function maxFields(){return subj(draft).map(s=>`<label>${s}<input type="number" required min="1" max="1000" step="any" data-max="${s}" value="${draft.max[s]}"></label>`).join('')}
function fail(err){const el=$('#modal-error');if(el){el.className='error';el.textContent=err instanceof Error?err.message:String(err)}else{notice=err instanceof Error?err.message:String(err);render()}}
function open(type){notice='';modal=type;draft=type==='exam'?{id:uid(),name:'',date:new Date().toLocaleDateString('en-CA'),kind:'平时',max:Object.fromEntries(ALL.map(s=>[s,100]))}:type==='scores'?deep(book.scores[exam().id]||{}):{};render();$('#overlay')?.focus()}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(q)throw Error('CSV 引号未闭合');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function importCSV(text){const e=exam(),rows=parseCSV(text.replace(/^\uFEFF/,'')),head=(rows.shift()||[]).map(v=>v.trim()),ss=subj(e);if(!['学号','姓名',...ss].every(s=>head.includes(s)))throw Error('表头需包含学号、姓名及本次全部科目');if(!rows.length)throw Error('没有可导入的数据');const next=deep(book),seen=new Set();next.scores[e.id]||={};rows.forEach((r,i)=>{const get=s=>(r[head.indexOf(s)]||'').trim(),id=get('学号'),name=get('姓名');if(!id||!name||seen.has(id))throw Error(`第 ${i+2} 行学号或姓名为空，或学号重复`);seen.add(id);const old=next.students.find(st=>st.id===id);if(old&&old.name!==name)throw Error(`学号 ${id} 的姓名与已有记录不一致`);if(!old)next.students.push({id,name});const cells={};for(const s of ss){const value=get(s);if(value!==''&&value!=='缺考'&&!/^\d+(\.\d+)?$/.test(value))throw Error(`第 ${i+2} 行${s}不是有效分数`);cells[s]=value===''||value==='缺考'?null:Number(value)}next.scores[e.id][id]=cells});persist(next)}
function saveScores(){try{const e=exam(),next=deep(book);next.scores[e.id]||={};document.querySelectorAll('[data-sid][data-sub]').forEach(input=>{const id=input.dataset.sid,s=input.dataset.sub;next.scores[e.id][id]||={};const value=input.value.trim();if(value!==''&&!/^\d+(\.\d+)?$/.test(value))throw Error(`${id} 的${s}分数无效`);next.scores[e.id][id][s]=value===''?null:Number(value)});persist(next)}catch(err){fail(err)}}
function download(filename,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function example(){const es=['2026-09-20','2026-10-20','2026-11-01'].map((date,i)=>({id:'demo'+i,name:['九月练习（示例）','十月练习（示例）','期中检测（示例）'][i],date,kind:i===2?'期中':'平时',max:Object.fromEntries(CORE.map(s=>[s,100]))})),ss=Array.from({length:12},(_,i)=>({id:'D'+String(i+1).padStart(2,'0'),name:'示例同学'+(i+1)})),scores={};es.forEach((e,j)=>{scores[e.id]={};ss.forEach((s,i)=>scores[e.id][s.id]=Object.fromEntries(CORE.map((sub,k)=>[sub,Math.min(100,48+(i*13+k*9)%44+j*3)])))});book={students:ss,exams:es,scores};examId=es.at(-1).id;studentId=ss[0].id;demo=true;notice='';view='overview';render()}
function action(a){try{if(a.startsWith('view-')){view=a.slice(5);render()}else if(a.startsWith('student:')){studentId=decodeURIComponent(a.slice(8));view='students';render()}else if(a==='view-subjects'){view='subjects';render()}else if(a.startsWith('open-'))open(a.slice(5));else if(a==='close'){modal='';render()}else if(a==='save-scores')saveScores();else if(a==='template'){const e=exam();download('2604-'+e.name.replace(/[\\/:*?"<>|]/g,'_')+'-成绩模板.csv','\uFEFF学号,姓名,'+subj(e).join(',')+'\r\n','text/csv;charset=utf-8')}else if(a==='import-csv')importCSV($('#csv-text').value);else if(a==='backup')download('2604成绩备份-'+new Date().toLocaleDateString('en-CA')+'.json',JSON.stringify(book,null,2),'application/json');else if(a==='confirm-restore'){persist(draft);examId=sorted().at(-1)?.id||'';studentId=book.students[0]?.id||'';render()}else if(a==='demo')example();else if(a==='leave-demo'){demo=false;book=EMPTY();try{const raw=localStorage.getItem(KEY);if(raw)book=JSON.parse(raw);validate(book)}catch(err){fail(err);return}examId=sorted().at(-1)?.id||'';studentId=book.students[0]?.id||'';notice='';render()}else if(a==='print')window.print()}catch(err){fail(err)}}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(target)action(target.dataset.action);else if(ev.target.id==='overlay'){modal='';render()}});
document.addEventListener('change',async ev=>{const t=ev.target;try{if(t.id==='exam-select'){examId=t.value;render()}else if(t.id==='student-select'){studentId=t.value;render()}else if(t.id==='kind'){draft.kind=t.value;$('#maxgrid').innerHTML=maxFields()}else if(t.id==='csv-file'){const f=t.files?.[0];if(f)$('#csv-text').value=await f.text()}else if(t.id==='restore-file'){const f=t.files?.[0];if(!f)return;const parsed=JSON.parse(await f.text());validate(parsed);draft=parsed;modal='restore';render()}}catch(err){fail(err)}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const pos=ev.target.selectionStart;search=ev.target.value;render();const input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('submit',ev=>{ev.preventDefault();try{if(ev.target.id==='exam-form'){const f=new FormData(ev.target),max={...draft.max};document.querySelectorAll('[data-max]').forEach(i=>max[i.dataset.max]=Number(i.value));const e={id:draft.id,name:String(f.get('name')).trim(),date:String(f.get('date')),kind:String(f.get('kind')),max};persist({...book,exams:[...book.exams,e]});examId=e.id;render()}else if(ev.target.id==='student-form'){const f=new FormData(ev.target),st={id:String(f.get('id')).trim(),name:String(f.get('name')).trim()};persist({...book,students:[...book.students,st]});studentId=st.id;render()}}catch(err){fail(err)}});
window.MingGrades={getBook:()=>deep(book),validate,parseCSV,total,rate};init();
})();
</script></body></html>
