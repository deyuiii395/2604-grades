 if(!e)return '<p class="letter-paragraph">待成绩记录齐备，再回看本次学习中的收获与不足。</p>';
 const list=sorted(),ix=list.findIndex(x=>x.id===e.id),previous=ix>0?list[ix-1]:null;
 const changes=previous?CORE.map(subject=>{const now=score(e,st.id,subject),old=score(previous,st.id,subject);return {subject,change:now===null||old===null?null:now/e.max[subject]*100-old/previous.max[subject]*100}}).filter(d=>d.change!==null):[];

 const note=drop?`与“${previous.name}”相比，你的${drop.subject}得分率下降了 ${fmt(-drop.change)} 个百分点。请结合两次试卷的题型与难度，回看这一科的失分原因。`:'请从本次试卷中选出几道值得重做的题，写清失分原因，完成订正，再用同类题检验是否真正掌握。';

}

function printStudents(all=false){

 if(!book.students.length)throw Error('请先导入学生名册。');
 if(all){const batch=document.createElement('div');batch.id='print-batch';batch.innerHTML=book.students.map(st=>growthReport(exam(),st)).join('');document.body.appendChild(batch)}

}

function emptyState(title='还没有考试',msg='新建考试后即可开始录入与分析。'){return card(`<div class="empty"><div class="emptyicon">✧</div><h3>${title}</h3><p>${msg}</p>${button('新建考试','open-exam','primary')} ${button('导入学号名册','view-settings')} ${button('体验虚构示例','demo')}</div>`)}
function render(){const e=exam(),names={overview:'学习概览',scores:'成绩总表',subjects:'学科分析',students:'成长档案',settings:'数据管理'};$('#app').innerHTML=`<div class="shell"><aside><div class="brand"><img src="data:image/png;base64,${EMBLEM}" alt="2604班金日版班徽"><span>明 · 成长<small>2604 班学情管理</small></span></div><div class="side-label">学习与成长</div><nav>${[['overview','◫'],['scores','▦'],['subjects','◩'],['students','♙'],['settings','⚙']].map(([k,icon])=>button(`<span class="navicon">${icon}</span>${names[k]}`,'view-'+k,view===k?'active':'')).join('')}</nav><div class="side-bottom">✦<strong>明德笃志，博学笃行。</strong><p>每一次记录，<br>都是下一步成长的起点。</p>${badge('初一 · 教师管理空间')}</div></aside><main><header><span>2604 班 <em>/</em> ${names[view]}</span><span class="sync">◯ ${demo?'演示模式 · 不写入存储':storageOK?'仅保存在当前浏览器':'本地存储不可用'}</span></header><div class="content"><div class="heading"><div><div class="eyebrow">LEARNING, ONE STEP AT A TIME</div><h1>${names[view]}</h1><p>看见努力的轨迹，让每一份进步都有方向。</p></div><div class="actions"><select id="exam-select" aria-label="选择考试"><option value="" disabled ${!e?'selected':''}>选择考试</option>${sorted().map(ex=>`<option value="${esc(ex.id)}" ${ex.id===e?.id?'selected':''}>${ex.order} · ${esc(ex.name)}（${esc(ex.date)}）</option>`).join('')}</select>${button('＋ 新建考试','open-exam','primary')}</div></div>${notice?`<div class="${storageOK?'notice':'error'}" role="status">${esc(notice)}</div>`:''}${demo?`<div class="notice">当前是虚构示例，刷新即消失，不会覆盖真实成绩。${button('返回真实数据','leave-demo')}</div>`:''}${view==='overview'?overview(e):view==='scores'?scores(e):view==='subjects'?subjectsView(e):view==='students'?studentsView(e):settings()}<footer>2604，胸怀壮志，青春正炽，无可复制。<span>明 · 成长 / 记录每一步</span></footer></div></main></div>${modal?modalView(e):''}`;}
function modalView(e){const titles={exam:'新建考试',rename:'修改考试名称',student:'添加学生',scores:'编辑本次成绩',import:'导入考试成绩',restore:'恢复备份'};let content='';if(modal==='exam')content=`<form id="exam-form"><label>考试名称<input name="name" required maxlength="80" placeholder="例如：七年级上学期期中检测" value="${esc(draft.name)}"></label><div class="form-two"><label>考试日期<input name="date" required type="date" value="${esc(draft.date)}"></label><label>考试类型<select name="kind" id="kind">${['平时','期中','期末'].map(k=>`<option ${draft.kind===k?'selected':''}>${k}</option>`).join('')}</select></label></div><h4>各科满分（请按实际试卷修改）</h4><div class="maxgrid" id="maxgrid">${maxFields()}</div><button class="primary">创建并保存</button></form>`;
else if(modal==='rename')content=`<form id="rename-form"><p>只修改名称；考试日期、顺序与已有成绩保持不变。</p><label>考试名称<input name="name" required maxlength="80" value="${esc(draft.name)}" autocomplete="off"></label><p class="muted">建议使用统一格式，例如“2026—2027学年第一学期·9月学情检测”。</p><button class="primary">保存名称</button></form>`;
else if(modal==='student')content=`<form id="student-form"><label>学号<input name="id" required maxlength="80"></label><label>姓名<input name="name" required maxlength="80"></label><button class="primary">保存学生</button></form>`;
else if(modal==='scores')content=`<p>空白表示缺考或未录入；0 分表示实际得 0 分。可输入小数。</p><div class="tablewrap edit"><table><thead><tr><th>学生</th>${subj(e).map(s=>`<th>${s}<small> / ${e.max[s]}</small></th>`).join('')}</tr></thead><tbody>${book.students.map(st=>`<tr><td>${esc(st.name)}<small>${esc(st.id)}</small></td>${subj(e).map(s=>`<td><input type="number" step="any" min="0" max="${e.max[s]}" data-sid="${esc(st.id)}" data-sub="${s}" aria-label="${esc(st.name+s)}" value="${draft[st.id]?.[s]??''}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><button data-action="save-scores" class="primary" ${!book.students.length?'disabled':''}>保存全部成绩</button>${!book.students.length?'<p>请先在数据管理中导入学号名册，或直接导入带编号和姓名的成绩表。</p>':''}`;
else if(modal==='import')content=`<p>可直接选择 Excel（.xlsx）或 CSV。网站会识别“学号/作业编号”“姓名”及语数外等科目列；只更新识别出的科目，其他成绩保持原样。</p>${button('↓ 下载当前考试 CSV 模板','template')}<label class="upload">选择成绩 Excel / CSV<input type="file" id="score-file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"></label><p id="file-summary" class="notice">选择文件后会显示识别到的工作表和科目，再点击导入。</p><label>也可粘贴 CSV 内容<textarea id="csv-text" rows="8" placeholder="学号,姓名,${subj(e).join(',')}"></textarea></label><p class="muted">如果表格只有姓名，会用已导入名册匹配；重名、编号冲突或超出满分时整批拒绝。</p>${button('校验并导入本次考试','import-file','primary')}`;
else if(modal==='restore')content=`<p>将以备份中的 ${draft.students.length} 名学生、${draft.exams.length} 场考试替换当前全部记录。建议先下载当前备份。</p>${button('确认恢复并保存','confirm-restore','primary')}`;
return `<div class="overlay" id="overlay"><section role="dialog" aria-modal="true" aria-label="${titles[modal]}" class="dialog ${modal==='scores'?'wide':''}"><div class="sectionhead"><h2>${titles[modal]}</h2>${button('✕','close')}</div><div id="modal-error" role="alert"></div>${content}</section></div>`}
function maxFields(){return subj(draft).map(s=>`<label>${s}<input type="number" required min="1" max="1000" step="any" data-max="${s}" value="${draft.max[s]}"></label>`).join('')}
function fail(err){const el=$('#modal-error');if(el){el.className='error';el.textContent=err instanceof Error?err.message:String(err)}else{notice=err instanceof Error?err.message:String(err);render()}}
function open(type){notice='';modal=type;draft=type==='exam'?{id:uid(),name:'',date:new Date().toLocaleDateString('en-CA'),kind:'平时',max:Object.fromEntries(ALL.map(s=>[s,100]))}:type==='scores'?deep(book.scores[exam().id]||{}):{};render();$('#overlay')?.focus()}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(q)throw Error('CSV 引号未闭合');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function importRosterTable(table){const {id,name}=table.columns;if(id<0||name<0)throw Error('名册需要编号和姓名两列；“作业编号”会自动作为学号');const next=deep(book),seen=new Set(),items=[];for(const row of table.rows){const sid=MingExcel.idOf(row[id]),person=MingExcel.nameOf(row[name]);if(!sid&&!person)continue;if(!sid||!person)throw Error('名册中有编号或姓名为空的记录');if(seen.has(sid))throw Error('名册中存在重复编号 '+sid);seen.add(sid);items.push({id:sid,name:person})}if(!items.length)throw Error('名册没有有效学生记录');for(const item of items){const existing=next.students.find(s=>s.id===item.id);if(existing){if(existing.name!==item.name)throw Error(`编号 ${item.id} 的姓名与现有记录不一致，请先核对`)}else if(next.students.some(s=>s.name===item.name))throw Error(`姓名 ${item.name} 已在其他编号下，请先核对`);else next.students.push(item)}persist(next);notice=`已从“${table.sheet}”识别作业编号/学号与姓名，导入 ${items.length} 位学生；当前共 ${book.students.length} 位。`;render()}
async function importRosterFile(file){if(!file)return;const tables=file.name.toLowerCase().endsWith('.csv')?[{name:'CSV',rows:parseCSV((await file.text()).replace(/^\uFEFF/,''))}]:MingExcel.readWorkbook(await file.arrayBuffer());importRosterTable(MingExcel.detect(tables,false))}
function importScoreTable(table){const e=exam();if(!e)throw Error('请先新建考试');const cols=table.columns,ss=Object.entries(cols.subjects).filter(([s])=>subj(e).includes(s));if(!ss.length)throw Error('文件中没有本场考试需要的科目列');const next=deep(book),seen=new Set();next.scores[e.id]||={};let count=0;for(const row of table.rows){let sid=cols.id>=0?MingExcel.idOf(row[cols.id]):'',name=cols.name>=0?MingExcel.nameOf(row[cols.name]):'';if(!sid&&!name)continue;let person=sid?next.students.find(s=>s.id===sid):null;if(!person&&name){const matches=next.students.filter(s=>s.name===name);if(matches.length>1)throw Error(`姓名 ${name} 对应多人，请提供编号`);if(matches.length===1){person=matches[0];if(sid&&sid!==person.id)throw Error(`姓名 ${name} 的编号与名册不一致`);sid=person.id}}
 if(!person){if(!sid||!name)throw Error('新学生需要编号和姓名；可先导入学号名册');person={id:sid,name};next.students.push(person)}else if(name&&name!==person.name)throw Error(`编号 ${sid} 的姓名与名册不一致`);if(seen.has(sid))throw Error(`成绩表中的编号 ${sid} 重复`);seen.add(sid);const values={...(next.scores[e.id][sid]||{})};for(const [subject,index] of ss){const raw=MingExcel.nameOf(row[index]);if(raw===''||raw==='缺考'){values[subject]=null;continue}if(!/^\d+(\.\d+)?$/.test(raw))throw Error(`${person.name} 的${subject}不是有效数字`);values[subject]=Number(raw)}next.scores[e.id][sid]=values;count++}if(!count)throw Error('没有可导入的成绩记录');persist(next);notice=`从“${table.sheet}”识别 ${count} 位学生、${ss.map(([s])=>s).join('、')} 成绩，已保存到当前考试。`;render()}
function importCSV(text){const rows=parseCSV(text.replace(/^\uFEFF/,''));importScoreTable(MingExcel.detect([{name:'CSV',rows}],true))}
async function readScoreFile(file){if(!file)return;if(file.name.toLowerCase().endsWith('.csv')){draft.scoreTable=MingExcel.detect([{name:'CSV',rows:parseCSV((await file.text()).replace(/^\uFEFF/,''))}],true)}else draft.scoreTable=MingExcel.detect(MingExcel.readWorkbook(await file.arrayBuffer()),true);const t=draft.scoreTable;$('#file-summary').textContent=`已识别工作表“${t.sheet}”，表头第 ${t.headerRow} 行；科目：${Object.keys(t.columns.subjects).join('、')}。确认后导入本次考试。`}
function moveExam(id,direction){const list=sorted(),index=list.findIndex(e=>e.id===id),other=index+(direction==='up'?-1:1);if(index<0||other<0||other>=list.length)return;[list[index],list[other]]=[list[other],list[index]];list.forEach((e,i)=>e.order=i+1);persist({...book,exams:list})}
function saveScores(){try{const e=exam(),next=deep(book);next.scores[e.id]||={};document.querySelectorAll('[data-sid][data-sub]').forEach(input=>{const id=input.dataset.sid,s=input.dataset.sub;next.scores[e.id][id]||={};const value=input.value.trim();if(value!==''&&!/^\d+(\.\d+)?$/.test(value))throw Error(`${id} 的${s}分数无效`);next.scores[e.id][id][s]=value===''?null:Number(value)});persist(next)}catch(err){fail(err)}}
function download(filename,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function example(){const es=['2026-09-20','2026-10-20','2026-11-01'].map((date,i)=>({id:'demo'+i,name:['九月练习（示例）','十月练习（示例）','期中检测（示例）'][i],date,order:i+1,kind:i===2?'期中':'平时',max:Object.fromEntries(CORE.map(s=>[s,100]))})),ss=Array.from({length:12},(_,i)=>({id:'D'+String(i+1).padStart(2,'0'),name:'示例同学'+(i+1)})),scores={};es.forEach((e,j)=>{scores[e.id]={};ss.forEach((s,i)=>scores[e.id][s.id]=Object.fromEntries(CORE.map((sub,k)=>[sub,Math.min(100,48+(i*13+k*9)%44+j*3)])))});book={students:ss,exams:es,scores};examId=es.at(-1).id;studentId=ss[0].id;demo=true;notice='';view='overview';render()}
function action(a){try{if(a.startsWith('view-')){view=a.slice(5);render()}else if(a.startsWith('student:')){studentId=decodeURIComponent(a.slice(8));view='students';render()}else if(a==='view-subjects'){view='subjects';render()}else if(a.startsWith('rename-exam:')){const id=decodeURIComponent(a.slice(12)),item=book.exams.find(ex=>ex.id===id);if(!item)throw Error('找不到这场考试');draft={id,name:item.name};modal='rename';render()}else if(a.startsWith('open-'))open(a.slice(5));else if(a==='close'){modal='';render()}else if(a==='save-scores')saveScores();else if(a==='template'){const e=exam();download('2604-'+e.name.replace(/[\\/:*?"<>|]/g,'_')+'-成绩模板.csv','\uFEFF学号,姓名,'+subj(e).join(',')+'\r\n','text/csv;charset=utf-8')}else if(a==='import-file'){const pasted=$('#csv-text').value.trim();if(pasted)importCSV(pasted);else if(draft.scoreTable)importScoreTable(draft.scoreTable);else throw Error('请先选择 Excel / CSV 文件，或粘贴 CSV 内容')}else if(a.startsWith('move-exam:')){const [,encoded,direction]=a.split(':');moveExam(decodeURIComponent(encoded),direction)}else if(a==='backup')download('2604成绩备份-'+new Date().toLocaleDateString('en-CA')+'.json',JSON.stringify(book,null,2),'application/json');else if(a==='confirm-restore'){persist(draft);examId=sorted().at(-1)?.id||'';studentId=book.students[0]?.id||'';render()}else if(a==='demo')example();else if(a==='leave-demo'){demo=false;book=EMPTY();try{const raw=localStorage.getItem(KEY);if(raw)book=JSON.parse(raw);validate(book)}catch(err){fail(err);return}examId=sorted().at(-1)?.id||'';studentId=book.students[0]?.id||'';notice='';render()}else if(a==='print')printStudents();else if(a==='print-all')printStudents(true)}catch(err){fail(err)}}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(target)action(target.dataset.action);else if(ev.target.id==='overlay'){modal='';render()}});
document.addEventListener('change',async ev=>{const t=ev.target;try{if(t.id==='exam-select'){examId=t.value;render()}else if(t.id==='student-select'){studentId=t.value;render()}else if(t.id==='kind'){draft.kind=t.value;$('#maxgrid').innerHTML=maxFields()}else if(t.id==='score-file'){await readScoreFile(t.files?.[0])}else if(t.id==='roster-file'){await importRosterFile(t.files?.[0])}else if(t.id==='restore-file'){const f=t.files?.[0];if(!f)return;const parsed=JSON.parse(await f.text());validate(parsed);draft=parsed;modal='restore';render()}}catch(err){fail(err)}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const pos=ev.target.selectionStart;search=ev.target.value;render();const input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('submit',ev=>{ev.preventDefault();try{if(ev.target.id==='rename-form'){const name=String(new FormData(ev.target).get('name')||'').trim();if(!name)throw Error('考试名称不能为空');if(book.exams.some(ex=>ex.id!==draft.id&&ex.name===name))throw Error('已有同名考试，请使用不同名称');const next=deep(book),item=next.exams.find(ex=>ex.id===draft.id);if(!item)throw Error('找不到这场考试');item.name=name;persist(next)}else if(ev.target.id==='exam-form'){const f=new FormData(ev.target),max={...draft.max};document.querySelectorAll('[data-max]').forEach(i=>max[i.dataset.max]=Number(i.value));const e={id:draft.id,name:String(f.get('name')).trim(),date:String(f.get('date')),kind:String(f.get('kind')),max};const ordered=sorted();const pos=ordered.filter(x=>x.date<=e.date).length;ordered.splice(pos,0,e);ordered.forEach((x,i)=>x.order=i+1);persist({...book,exams:ordered});examId=e.id;render()}else if(ev.target.id==='student-form'){const f=new FormData(ev.target),st={id:String(f.get('id')).trim(),name:String(f.get('name')).trim()};persist({...book,students:[...book.students,st]});studentId=st.id;render()}}catch(err){fail(err)}});
window.MingGrades={getBook:()=>deep(book),validate,parseCSV,total,rate};init();
})();
</script></body></html>
